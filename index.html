    <script>
      // Safe guard against Chrome extension interference (e.g. Similarweb/frame_ant: Cannot set property fetch of #<Window>)
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var _nativeFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _nativeFetch;
              },
              set: function(fn) {
                if (typeof fn === 'function') {
                  _nativeFetch = fn.bind(window);
                } else {
                  _nativeFetch = fn;
                }
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (err) {
          // Fallback gracefully
        }

        // Intercept uncaught errors from third-party extensions
        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('frame_ant') !== -1)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason).indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
          }
        });
      })();
    </script>
